<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Testing Wedding Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff4dc, #f8d7a5);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .wedding-card {
            width: min(90%, 500px);
            padding: 45px 25px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.18);
        }

        .wedding-card h1 {
            margin: 0 0 15px;
            color: #8b4513;
            font-size: 34px;
        }

        .wedding-card p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
        }

        .test-badge {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            border-radius: 50px;
            background: #8b4513;
            color: white;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="wedding-card">

        <h1>💍 शुभ विवाह 💍</h1>

        <p>
            राहुल ❤️ प्रिया
        </p>

        <p>
            यह हमारा <strong>Testing Wedding Card</strong> है।
            <br>
            अगर आप यह page देख रहे हैं,
            तो GitHub वाला link सही काम कर रहा है। 🎉
        </p>

        <div class="test-badge">
            ✅ WEBSITE TEST SUCCESSFUL
        </div>

    </div>

</body>
</html>
